name: Build iOS (IPA sem assinatura)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar o projeto iOS
        run: npx expo prebuild --platform ios --clean

      - name: Compilar o app para iPhone (sem assinatura)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Montar o arquivo .ipa
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r ControleGastos.ipa Payload

      - name: Disponibilizar o .ipa para baixar
        uses: actions/upload-artifact@v4
        with:
          name: ControleGastos-ipa
          path: ControleGastos.ipa
